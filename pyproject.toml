[project]
name = "german-schreiben-flashcards"
version = "0.1.0"
description = "Generate C1 German writing flashcards from essay drafts with topic-agnostic discourse filtering."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts", ".apm/skills/german-schreiben-flashcards/scripts"]
testpaths = ["tests"]
